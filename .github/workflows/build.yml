name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Collect artifact
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/CellTraceLogger.apk
          cd out
          sha256sum CellTraceLogger.apk > CellTraceLogger.apk.sha256
          ls -l

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CellTraceLogger-apk
          path: out/*
          retention-days: 30

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-build${{ github.run_number }}
          name: CellTraceLogger 1.0.0 (build ${{ github.run_number }})
          files: |
            out/CellTraceLogger.apk
            out/CellTraceLogger.apk.sha256
          body: |
            自动构建产物（debug 签名，可直接侧载安装）。

            安装：手机开启"允许安装未知来源应用"，点击 APK 安装即可。
            Android 10 及以上首次启动需授予定位权限，否则读不到小区信息。
